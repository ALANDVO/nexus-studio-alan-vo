version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-studio-backend
    environment:
      - APP_NAME=nexus-studio
      - APP_VERSION=1.0.0
      - DEBUG=false
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/nexus_studio.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=nexus-studio
      - KEYCLOAK_CLIENT_ID=nexus-studio-client
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/nexus-studio
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=gpt-4o-mini
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_TIMEOUT=30
      - SECRET_KEY=${SECRET_KEY}
      - CSRF_SECRET=${CSRF_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=["http://localhost:5173","http://frontend:5173"]
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexus-studio-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nexus-studio-frontend
    environment:
      - VITE_API_BASE_URL=http://backend:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexus-studio-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexus-studio-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=dev-file
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - nexus-studio-network

volumes:
  backend_data:
  keycloak_data:

networks:
  nexus-studio-network:
    driver: bridge