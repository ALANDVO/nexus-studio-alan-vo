name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=backend .venv/bin/python -m pytest app/tests -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "test-secret-key-for-ci-only"
          CSRF_SECRET: "test-csrf-secret-for-ci-only"
          KEYCLOAK_CLIENT_SECRET: "test-secret"
          KEYCLOAK_ADMIN_PASSWORD: "test-password"

  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run frontend tests
        run: npm test

  docker-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: nexus-studio-backend:test
          load: true

  docker-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: nexus-studio-frontend:test
          load: true

  validate:
    name: Validate Portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate portfolio.json
        run: |
          python3 -c "
          import json
          with open('portfolio.json') as f:
              data = json.load(f)
          assert data['schema_version'] == 1
          assert data['name'] == 'nexus-studio-alan-vo'
          assert data['owner'] == 'ALANDVO'
          assert data['email'] == 'alanvo@gmail.com'
          assert len(data['workflows']) >= 3
          assert data['auth'] == 'oidc-keycloak-saml-broker'
          assert set(data['llm_providers']) == {'openai-compatible', 'anthropic', 'gemini', 'ollama'}
          print('portfolio.json validation passed')
          "