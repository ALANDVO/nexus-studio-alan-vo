[project]
name = "nexus-studio"
version = "1.0.0"
description = "AI/ML developer tools for Bedrock model resolution, plugin validation, and bootstrap token management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["ai", "ml", "bedrock", "aws", "plugin", "validator", "bootstrap", "oidc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.2",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/nexus-studio-alan-vo"
Repository = "https://github.com/ALANDVO/nexus-studio-alan-vo"
Issues = "https://github.com/ALANDVO/nexus-studio-alan-vo/issues"

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/app/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true